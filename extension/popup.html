<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT ↔ Codex</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header"><h1>ChatGPT ↔ Codex</h1></header>
  <main>
    <section id="connectionConfigSection" class="card connection-config-section">
      <h2>连接配置</h2>
      <label>桥接连接信息
        <input id="connectionCode" type="text" placeholder="端口|终端显示的令牌">
      </label>
      <button id="bind" class="button primary full">绑定当前 ChatGPT 标签页</button>
    </section>

    <section id="startSection" class="card start-section" hidden>
      <div class="section-heading">
        <h2>选择起点</h2>
        <span id="startConnectionStatus" class="connection-status"></span>
      </div>
      <div class="inline-controls">
        <select id="startMode" aria-label="本次起点">
          <option value="A">A · 网页现有指令卡片</option>
          <option value="B">B · Codex 最新最终报告</option>
        </select>
        <button id="startSelected" class="button primary">开始</button>
      </div>
      <p class="hint">A 会重新执行当前卡片，确认不是旧指令；B 使用 Codex 最新报告。重选会替换待发报告。</p>
      <div id="startTaskPhase" class="task-phase"></div>
    </section>

    <section id="currentTaskSection" class="card current-task" hidden>
      <div class="section-heading">
        <h2>当前任务</h2>
        <span id="connectionStatus" class="connection-status">正在检查连接</span>
      </div>
      <div id="currentTaskName" class="task-name">—</div>
      <div id="taskPhase" class="task-phase">读取任务状态…</div>
      <button id="endFlow" class="button primary full" disabled>结束当前流程</button>
    </section>

    <p id="status" class="feedback global-feedback" role="status" aria-live="polite"></p>

    <section class="card optimizer-card">
      <h2>长对话加速</h2>
      <label class="check-row"><input id="optimizerEnabled" type="checkbox">启用</label>
      <div class="settings-row">
        <label for="optimizerKeepRounds">最近 N 轮</label>
        <input id="optimizerKeepRounds" type="number" min="1" max="500" step="1">
      </div>
      <label class="check-row"><input id="optimizerLiveWindow" type="checkbox">实时滑动窗口</label>
      <label class="check-row"><input id="optimizerRenderOptimize" type="checkbox">屏幕外渲染优化</label>
      <button id="optimizerApply" class="button secondary full">应用并刷新</button>
      <p id="optimizerStatus" class="hint" aria-live="polite">读取加速器设置…</p>
    </section>

    <details class="card task-list-card">
      <summary>已连接任务</summary>
      <div id="connections" class="connection-list"></div>
    </details>

    <details id="moreActions" class="card more-actions">
      <summary>更多操作</summary>
      <div class="details-content">
        <section class="action-block">
          <h3>指令卡片</h3>
          <button id="viewCards" class="button secondary full">查看卡片</button>
          <div id="cardChoices" class="card-choices"></div>
        </section>

        <section id="reportRecoveryActions" class="action-block" hidden>
          <h3>报告恢复</h3>
          <p class="hint">仅在报告待确认时使用。</p>
          <div class="button-grid">
            <button id="recheck" class="button secondary">重新检查</button>
            <button id="confirmSent" class="button secondary">已发送，继续</button>
            <button id="retrySend" class="button secondary">未发送，重发</button>
          </div>
        </section>

        <section class="action-block">
          <h3>操作记录</h3>
          <button id="viewLog" class="button secondary full">查看最近操作记录</button>
          <p class="hint">日志按 Codex 任务分别保存，不含令牌或消息正文。</p>
          <pre id="operationLog" class="operation-log"></pre>
        </section>
      </div>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
